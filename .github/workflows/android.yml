name: Android app

on:
  push:
    paths: [ "android/**", ".github/workflows/android.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "android/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For publishing the APK to the "latest" release on main
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Test, lint and build
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Show lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk crondroid.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crondroid-apk
          path: android/crondroid.apk

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest crondroid.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Crondroid (latest build)" \
            --notes "Built from $GITHUB_SHA. Open this page on your phone and tap crondroid.apk to install."
